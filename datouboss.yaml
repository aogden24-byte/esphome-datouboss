# ============================================================
# Datouboss 4863U (SRNE-based) RS485 / Modbus package for ESPHome
#
# Include this from your device config with `packages:`.
# See README.md for wiring, the confirmed register map, and caveats.
#
# Tested on: Datouboss 4863U, 6300 W, 48 V, 120 V/60 Hz single phase,
# via the WiFi-dongle RJ45 port (NOT the BMS port).
#
# SAFETY: every template switch below uses restore_mode: DISABLED so
# nothing is written to the inverter on boot. Keep it that way.
# ============================================================

# Defaults - override any of these in your own device config.
substitutions:
  uart_rx_pin: GPIO22
  uart_tx_pin: GPIO19
  modbus_address: "1"

uart:
  id: mod_uart
  rx_pin: ${uart_rx_pin}
  tx_pin: ${uart_tx_pin}
  baud_rate: 9600
  stop_bits: 1
  data_bits: 8
  parity: NONE
  rx_full_threshold: 1
  rx_timeout: 2

modbus:
  id: modbus0
  uart_id: mod_uart
  turnaround_time: 20ms

modbus_controller:
  - id: datouboss_fast
    address: ${modbus_address}
    modbus_id: modbus0
    setup_priority: -10
    update_interval: 1s

  - id: datouboss_slow
    address: ${modbus_address}
    modbus_id: modbus0
    setup_priority: -10
    update_interval: 20s

# ====================================================
# INVERTER POWER SWITCH — confirmed 2026-09-30 via RS485 sniff.
# Register 0x0087 LOW byte: 1 = on, 0 = off. The HIGH byte is the BMS
# Lithium Battery Address (mapped 2026-10-10) and is preserved on write.
# (The old 0xDF00 attempt is gone — that address was rejected outright
# with Modbus exception 2 and never worked.)
#
# NOTE: this file has exactly ONE "number:" key, covering every
# writable register below (power switch through max charge current).
# Do not add a second "number:" block — YAML/ESPHome will reject a
# duplicate top-level key. Same rule for "switch:" and "select:".
# ====================================================
globals:
  - id: gc_was_charging
    type: bool
    restore_value: no
    initial_value: 'false'

number:
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: inverter_output_enable_num
    address: 0x0087
    register_type: holding
    value_type: U_WORD
    internal: true
    min_value: 0
    max_value: 1
    step: 1
    lambda: "return (int)(((uint16_t)x) & 0xFF);"
    write_lambda: |-
      float raw_f = id(reg_0087_raw).state;
      if (isnan(raw_f)) return NAN;
      return (uint16_t)((((uint16_t) raw_f) & 0xFF00) | ((uint16_t)x & 0xFF));

  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: intelligent_output_switch_num
    address: 0x007B
    register_type: holding
    value_type: U_WORD
    internal: true
    min_value: 0
    max_value: 1
    step: 1

  # Confirmed 2026-09-30. Register 0x0072 LOW byte, shares the register
  # with Over Temp Restart below — the high byte is preserved on write,
  # not clobbered.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: grid_connected_mode_num
    address: 0x0072
    register_type: holding
    value_type: U_WORD
    internal: true
    min_value: 0
    max_value: 3
    step: 1
    lambda: "return (int)(((uint16_t)x) & 0xFF);"
    write_lambda: |-
      float restart_f = id(setting_over_temp_restart_num).state;
      if (isnan(restart_f)) return NAN;
      uint16_t restart = (uint16_t) restart_f;
      return (uint16_t)((restart << 8) | ((uint16_t)x & 0xFF));

  # Confirmed 2026-09-30. Register 0x0072 HIGH byte — see above.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_over_temp_restart_num
    address: 0x0072
    register_type: holding
    value_type: U_WORD
    internal: true
    min_value: 0
    max_value: 1
    step: 1
    lambda: "return (int)(((uint16_t)x) >> 8);"
    write_lambda: |-
      float grid_mode_f = id(grid_connected_mode_num).state;
      if (isnan(grid_mode_f)) return NAN;
      uint16_t grid_mode = (uint16_t) grid_mode_f;
      return (uint16_t)(((uint16_t)x << 8) | (grid_mode & 0xFF));

  # Confirmed 2026-09-30, corrected address from the original guess of
  # 0x0090 (wrong) to 0x0063 (right). Numeric order confirmed both
  # directions (0=SNU, 1=OSO). 2=CSO inferred, not directly tested.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_charger_priority_num
    address: 0x0063
    register_type: holding
    value_type: U_WORD
    internal: true
    min_value: 0
    max_value: 2
    step: 1
    lambda: "return (int)(((uint16_t)x) >> 8);"
    # LOW byte = Battery Free Mode Selection (mapped 2026-10-10); preserved.
    write_lambda: |-
      float raw_f = id(reg_0063_raw).state;
      if (isnan(raw_f)) return NAN;
      return (uint16_t)(((uint16_t)x << 8) | (((uint16_t) raw_f) & 0xFF));

  # 0x0088 LOW byte = A17 BMS protocol (0 Lead-acid, 1 Growatt,
  # 2 Voltronic, 3 Pylontech, 4 PACE, 5 Pylontech-A). HIGH byte =
  # Lithium Battery Shutdown SOC (mapped 2026-10-10). Each write keeps
  # the other byte.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_bms_protocol_num
    address: 0x0088
    register_type: holding
    value_type: U_WORD
    internal: true
    min_value: 0
    max_value: 5
    step: 1
    lambda: "return (int)(((uint16_t)x) & 0xFF);"
    write_lambda: |-
      float hi_f = id(setting_0088_hi_num).state;
      if (isnan(hi_f)) return NAN;
      uint16_t hi = (uint16_t) hi_f;
      return (uint16_t)((hi << 8) | ((uint16_t)x & 0xFF));

  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_0088_hi_num
    name: "Setting: Lithium Battery Shutdown SOC"
    address: 0x0088
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    mode: box
    min_value: 0
    max_value: 100
    step: 1
    lambda: "return (int)(((uint16_t)x) >> 8);"
    write_lambda: |-
      float proto_f = id(setting_bms_protocol_num).state;
      if (isnan(proto_f)) return NAN;
      uint16_t proto = (uint16_t) proto_f;
      return (uint16_t)(((uint16_t)x << 8) | (proto & 0xFF));

  # A16 / portal "HFP Grid Connected Current": export current limit,
  # A = W / 120 V. HIGH byte; write confirmed (12 A -> 13 A). LOW byte =
  # Neutral Grounding, preserved on write (never change it from here).
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_ac_input_limit
    name: "Setting A16: HFP Grid-Connected Current (Export Limit)"
    address: 0x0075
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    min_value: 0
    max_value: 60
    step: 1
    lambda: "return (int)(((uint16_t)x) >> 8);"
    write_lambda: |-
      float raw_f = id(reg_0075_raw).state;
      if (isnan(raw_f)) return NAN;
      return (uint16_t)(((uint16_t)x << 8) | (((uint16_t) raw_f) & 0xFF));

  # Confirmed 2026-09-30 by direct write test — corrected from the old
  # "AC Charge Start/Stop SOC" guess, which was the wrong meaning at the
  # right address.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_mains_supply_soc
    name: "Grid Start SOC"
    mode: box
    address: 0x008A
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    lambda: "return (int)(((uint16_t)x) >> 8);"
    write_lambda: |-
      float batt_soc_f = id(setting_battery_powered_soc).state;
      if (isnan(batt_soc_f)) return NAN;
      uint16_t batt_soc = (uint16_t) batt_soc_f;
      return (uint16_t)(((uint16_t)x << 8) | (batt_soc & 0xFF));

  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_battery_powered_soc
    name: "Grid Off SOC"
    mode: box
    address: 0x008A
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    lambda: "return (int)(((uint16_t)x) & 0xFF);"
    write_lambda: |-
      float mains_soc_f = id(setting_mains_supply_soc).state;
      if (isnan(mains_soc_f)) return NAN;
      uint16_t mains_soc = (uint16_t) mains_soc_f;
      return (uint16_t)(((uint16_t)mains_soc << 8) | ((uint16_t)x & 0xFF));

  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_float_charge_voltage
    name: "Setting: Float Charge Voltage"
    address: 0x0068
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    min_value: 40.0
    max_value: 60.0
    step: 0.1
    lambda: "return x * 0.1;"
    write_lambda: "return (uint16_t)(x * 10.0);"

  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_bulk_voltage
    name: "Setting: Battery High Voltage Recovery"
    address: 0x006B
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    min_value: 40.0
    max_value: 60.0
    step: 0.1
    lambda: "return x * 0.1;"
    write_lambda: "return (uint16_t)(x * 10.0);"

  # 0x0067 is Equalization Voltage (mapped 2026-10-10). It was first
  # labelled "Charge Disconnect Voltage", which is why charging never
  # responded to it.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_charge_disconnect_v
    name: "Setting: Equalization Voltage"
    address: 0x0067
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    mode: box
    min_value: 48.0
    max_value: 60.0
    step: 0.1
    lambda: "return x * 0.1;"
    write_lambda: "return (uint16_t)(x * 10.0f + 0.5f);"

  # Corrected 2026-09-30: this is "Inverter Priority Battery Supply
  # Voltage" (governs load-source switchover in SBU mode), not "Grid
  # Charge Disable Voltage" as originally guessed. Confirmed both
  # directions by direct write test.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_battery_supply_v
    name: "Setting: Inverter Priority Battery Supply Voltage"
    address: 0x0070
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    min_value: 40.0
    max_value: 60.0
    step: 0.1
    lambda: "return x * 0.1;"
    write_lambda: "return (uint16_t)(x * 10.0);"

  # Corrected 2026-09-30: this is "Inverter Priority Mains Supply
  # Voltage", not "Low Voltage Disconnect". Confirmed by direct write
  # test.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_mains_supply_v
    name: "Setting: Inverter Priority Mains Supply Voltage"
    address: 0x0071
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    min_value: 40.0
    max_value: 55.0
    step: 0.1
    lambda: "return x * 0.1;"
    write_lambda: "return (uint16_t)(x * 10.0);"

  # 0x006E Battery Low Voltage Recovery (mapped 2026-10-10).
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_grid_charge_enable_v
    name: "Setting: Battery Low Voltage Recovery"
    address: 0x006E
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    min_value: 40.0
    max_value: 55.0
    step: 0.1
    lambda: "return x * 0.1;"
    write_lambda: "return (uint16_t)(x * 10.0);"

  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_max_charge_current
    name: "Setting A13: Max Charging Current (PV + Mains)"
    address: 0x0064
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    min_value: 5
    max_value: 120
    step: 1
    lambda: "return (int)(((uint16_t)x) >> 8);"
    write_lambda: |-
      float lo_f = id(setting_mains_charge_current).state;
      if (isnan(lo_f)) return NAN;
      return (uint16_t)(((uint16_t)x << 8) | ((uint16_t)lo_f & 0xFF));

  # A12 Mains charging current = 0x0064 LOW byte (read 10, matching the
  # app's "Mains Maximum Charging Current" tile; ~10 A gave ~520 W into
  # the battery). Value match only - first write is the confirmation.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_mains_charge_current
    name: "Setting A12: Mains Charging Current"
    address: 0x0064
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    min_value: 5
    max_value: 80
    step: 1
    lambda: "return (int)(((uint16_t)x) & 0xFF);"
    write_lambda: |-
      float hi_f = id(setting_max_charge_current).state;
      if (isnan(hi_f)) return NAN;
      return (uint16_t)(((uint16_t)hi_f << 8) | ((uint16_t)x & 0xFF));

  # 0x0089: HIGH byte = A23 charge cut-off SOC, LOW byte = A20 low-voltage
  # recover SOC. Read 100 / 15 (both match the manual's defaults).
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_a23_soc
    name: "Setting A23: Charge Cut-off SOC"
    address: 0x0089
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 1
    max_value: 100
    step: 1
    lambda: "return (int)(((uint16_t)x) >> 8);"
    write_lambda: |-
      float lo_f = id(setting_a20_soc).state;
      if (isnan(lo_f)) return NAN;
      return (uint16_t)(((uint16_t)x << 8) | ((uint16_t)lo_f & 0xFF));

  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_a20_soc
    name: "Setting A20: Low-Voltage Recover SOC"
    address: 0x0089
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 1
    max_value: 90
    step: 1
    lambda: "return (int)(((uint16_t)x) & 0xFF);"
    write_lambda: |-
      float hi_f = id(setting_a23_soc).state;
      if (isnan(hi_f)) return NAN;
      return (uint16_t)(((uint16_t)hi_f << 8) | ((uint16_t)x & 0xFF));

  # ---- Battery voltage protection (mapped 2026-10-10) ----
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_hv_protection
    name: "Setting: Battery High Voltage Protection"
    address: 0x0069
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    mode: box
    min_value: 50.0
    max_value: 70.0
    step: 0.1
    lambda: "return x * 0.1;"
    write_lambda: "return (uint16_t)(x * 10.0f + 0.5f);"

  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_hv_alarm
    name: "Setting: Battery High Voltage Alarm"
    address: 0x006A
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    mode: box
    min_value: 50.0
    max_value: 70.0
    step: 0.1
    lambda: "return x * 0.1;"
    write_lambda: "return (uint16_t)(x * 10.0f + 0.5f);"

  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_lv_protection
    name: "Setting: Battery Low Voltage Protection"
    address: 0x006C
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    mode: box
    min_value: 40.0
    max_value: 52.0
    step: 0.1
    lambda: "return x * 0.1;"
    write_lambda: "return (uint16_t)(x * 10.0f + 0.5f);"

  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_lv_alarm
    name: "Setting: Battery Low Voltage Alarm"
    address: 0x006D
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    mode: box
    min_value: 40.0
    max_value: 52.0
    step: 0.1
    lambda: "return x * 0.1;"
    write_lambda: "return (uint16_t)(x * 10.0f + 0.5f);"

  # ---- Built-in output cutoff (mapped 2026-10-10; 0 = disabled) ----
  # Whole registers; 0.1 V scaling assumed like every other voltage
  # register. Check the value on the portal after the first write.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_output_off_v
    name: "Setting: Output Off Battery Voltage"
    address: 0x0076
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    mode: box
    min_value: 0
    max_value: 60.0
    step: 0.1
    lambda: "return x * 0.1;"
    write_lambda: "return (uint16_t)(x * 10.0f + 0.5f);"

  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_output_restore_v
    name: "Setting: Output Restore Battery Voltage"
    address: 0x0077
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    mode: box
    min_value: 0
    max_value: 60.0
    step: 0.1
    lambda: "return x * 0.1;"
    write_lambda: "return (uint16_t)(x * 10.0f + 0.5f);"

  # 0x0078 HIGH byte = Restore Main Output SOC, LOW byte = Turn Off Main
  # Output SOC. Byte order inferred from the portal's list order (both
  # read 0); check the portal after the first write.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_restore_output_soc
    name: "Setting: Restore Main Output SOC"
    address: 0x0078
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    mode: box
    min_value: 0
    max_value: 100
    step: 1
    lambda: "return (int)(((uint16_t)x) >> 8);"
    write_lambda: |-
      float lo_f = id(setting_turnoff_output_soc).state;
      if (isnan(lo_f)) return NAN;
      return (uint16_t)(((uint16_t)x << 8) | ((uint16_t)lo_f & 0xFF));

  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_turnoff_output_soc
    name: "Setting: Turn Off Main Output SOC"
    address: 0x0078
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    mode: box
    min_value: 0
    max_value: 100
    step: 1
    lambda: "return (int)(((uint16_t)x) & 0xFF);"
    write_lambda: |-
      float hi_f = id(setting_restore_output_soc).state;
      if (isnan(hi_f)) return NAN;
      return (uint16_t)(((uint16_t)hi_f << 8) | ((uint16_t)x & 0xFF));

  # Target SOC for Grid Charging (stored on the ESP32, not the inverter).
  - platform: template
    id: grid_charge_target
    name: "Grid Charging Target SOC"
    icon: "mdi:battery-arrow-up"
    unit_of_measurement: "%"
    min_value: 50
    max_value: 99
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 95

  # 0x0060 HIGH byte = A0 Output Priority. Confirmed by app writes:
  # 2 = PV, 3 = PBG (battery). GRD (mains) value not yet observed; see
  # the "Output Priority Raw Value" sensor after setting GRD on the LCD.
  # LOW byte has read 0 in every capture; it is preserved on write.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_load_priority_num
    address: 0x0060
    register_type: holding
    value_type: U_WORD
    internal: true
    min_value: 0
    max_value: 3
    step: 1
    lambda: "return (int)(((uint16_t)x) >> 8);"
    write_lambda: |-
      float raw_f = id(reg_0060_raw).state;
      if (isnan(raw_f)) return NAN;
      uint16_t low = ((uint16_t) raw_f) & 0xFF;
      return (uint16_t)(((uint16_t)x << 8) | low);


  # A14 AC input voltage range, 0x0066 HIGH byte. 0 = narrow (a 120 V
  # grid is treated as out of range, so loads run on battery and mains
  # is never used), 1 = wide (grid accepted: mains passthrough and grid
  # charging possible). Low byte (reads 0x30) is preserved on write.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_ac_input_range_num
    address: 0x0066
    register_type: holding
    value_type: U_WORD
    internal: true
    min_value: 0
    max_value: 1
    step: 1
    lambda: "return (int)(((uint16_t)x) >> 8);"
    write_lambda: |-
      float raw_f = id(reg_0066_raw).state;
      if (isnan(raw_f)) return NAN;
      uint16_t low = ((uint16_t) raw_f) & 0xFF;
      return (uint16_t)(((uint16_t)x << 8) | low);

  # Whole 0x008A word (A21 high byte, A22 low byte), so Grid Charging can
  # set both thresholds in ONE write instead of two back-to-back writes.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: soc_pair_raw
    address: 0x008A
    register_type: holding
    value_type: U_WORD
    internal: true
    min_value: 0
    max_value: 65535
    step: 1
switch:
  - platform: template
    name: "Inverter Power Switch"
    id: inverter_power_switch
    icon: "mdi:power"
    # Reads real state from 0x0087 (low byte 1 = on) instead of guessing.
    optimistic: false
    lambda: |-
      if (!id(inverter_output_enable_num).has_state()) return {};
      return id(inverter_output_enable_num).state > 0.5;
    # CRITICAL: DISABLED means no turn_on/turn_off action fires at boot.
    # Without it, ESPHome defaults to ALWAYS_OFF and would switch the
    # inverter output OFF on every reboot/reflash.
    restore_mode: DISABLED
    turn_on_action:
      - number.set:
          id: inverter_output_enable_num
          value: 1
    turn_off_action:
      - number.set:
          id: inverter_output_enable_num
          value: 0

  # Confirmed 2026-09-30, both directions. Register 0x007B, whole
  # register, 1=On / 0=Off. Possibly the ECO/idle-reduction behavior —
  # never got a clean before/after wattage comparison, worth revisiting.
  - platform: template
    name: "Intelligent Output Switch"
    id: intelligent_output_switch
    icon: "mdi:leaf"
    optimistic: false
    restore_mode: DISABLED
    lambda: |-
      if (!id(intelligent_output_switch_num).has_state()) return {};
      return id(intelligent_output_switch_num).state > 0.5;
    turn_on_action:
      - number.set:
          id: intelligent_output_switch_num
          value: 1
    turn_off_action:
      - number.set:
          id: intelligent_output_switch_num
          value: 0

  # Confirmed 2026-09-30. Register 0x0072 HIGH byte, shares the register
  # with Grid Connected Mode below — the low byte is preserved on write,
  # not clobbered.
  - platform: template
    name: "Setting: Over Temperature Restart"
    id: setting_over_temp_restart
    optimistic: false
    restore_mode: DISABLED
    lambda: |-
      if (!id(setting_over_temp_restart_num).has_state()) return {};
      return id(setting_over_temp_restart_num).state > 0.5;
    turn_on_action:
      - number.set:
          id: setting_over_temp_restart_num
          value: 1
    turn_off_action:
      - number.set:
          id: setting_over_temp_restart_num
          value: 0

# ====================================================
# SETTINGS MENUS
# ====================================================

  # Grid Charging. Confirmed 2026-10-02: with A0 = PV, the SOC switchover
  # thresholds act live - A21 ("Inverter To Mains Supply SOC") set ABOVE
  # the current SOC hands over to mains and, with SNU, starts a mains
  # charge within seconds; A22 ("Inverter To Battery Powered SOC") set
  # BELOW the current SOC hands back to battery and stops it. No output
  # restart needed.
  # ON: SNU, wide AC input range (A14), Hybrid, A0 = PV, A22 = target,
  #     A21 = SOC + 3 (kept below target). The inverter itself hands back
  #     to battery when SOC reaches the target; the switch then turns off.
  # OFF: A22 = 5 (stops any running charge), A21 = 10, A22 = 80, OSO,
  #     narrow A14, Off Grid, A0 = PBG.
  # Refuses to start, and auto-switches off, above 1500 W output.
  - platform: template
    name: "Grid Charging"
    id: grid_charging
    icon: "mdi:transmission-tower-import"
    optimistic: false
    restore_mode: DISABLED
    lambda: |-
      float pri = id(setting_charger_priority_num).state;
      float rng = id(setting_ac_input_range_num).state;
      if (isnan(pri) || isnan(rng)) return {};
      return pri < 0.5 && rng > 0.5;
    turn_on_action:
      - if:
          condition:
            lambda: |-
              float soc = id(raw_reg_0033).state;
              return id(ac_output_active_power).state > 1500 || isnan(soc) ||
                     soc + 2 >= id(grid_charge_target).state;
          then:
            - logger.log:
                format: "Grid Charging refused: load above 1500 W, SOC unknown, or within 2 percent of target"
                level: WARN
          else:
            # One write per register, 5 s apart, skipping values already
            # set: rapid back-to-back writes were being dropped.
            - if:
                condition:
                  lambda: 'return id(setting_charger_priority_num).state != 0;'
                then:
                  - number.set:
                      id: setting_charger_priority_num
                      value: 0
                  - delay: 5s
            - if:
                condition:
                  lambda: 'return id(setting_ac_input_range_num).state != 1;'
                then:
                  - number.set:
                      id: setting_ac_input_range_num
                      value: 1
                  - delay: 5s
            - if:
                condition:
                  lambda: 'return id(grid_connected_mode_num).state != 0;'
                then:
                  - number.set:
                      id: grid_connected_mode_num
                      value: 0
                  - delay: 5s
            - if:
                condition:
                  lambda: 'return id(setting_load_priority_num).state != 2;'
                then:
                  - number.set:
                      id: setting_load_priority_num
                      value: 2
                  - delay: 5s
            # A21 = SOC + 3 (below target), A22 = target, in a single write.
            - number.set:
                id: soc_pair_raw
                value: !lambda |-
                  int tgt = (int) id(grid_charge_target).state;
                  int a21 = (int) id(raw_reg_0033).state + 3;
                  if (a21 > tgt - 1) a21 = tgt - 1;
                  return (float)((a21 << 8) | (tgt & 0xFF));
            - logger.log: "Grid Charging on: A21 above SOC, mains charge should start"
    turn_off_action:
      # A21 = 10, A22 = 5 in one write: A22 below SOC hands back to battery
      # immediately, stopping any running charge.
      - number.set:
          id: soc_pair_raw
          value: !lambda 'return (float)((10 << 8) | 5);'
      - delay: 5s
      - number.set:
          id: soc_pair_raw
          value: !lambda 'return (float)((10 << 8) | 80);'
      - delay: 5s
      - if:
          condition:
            lambda: 'return id(setting_charger_priority_num).state != 1;'
          then:
            - number.set:
                id: setting_charger_priority_num
                value: 1
            - delay: 5s
      - if:
          condition:
            lambda: 'return id(setting_ac_input_range_num).state != 0;'
          then:
            - number.set:
                id: setting_ac_input_range_num
                value: 0
            - delay: 5s
      - if:
          condition:
            lambda: 'return id(grid_connected_mode_num).state != 2;'
          then:
            - number.set:
                id: grid_connected_mode_num
                value: 2
            - delay: 5s
      - if:
          condition:
            lambda: 'return id(setting_load_priority_num).state != 3;'
          then:
            - number.set:
                id: setting_load_priority_num
                value: 3
      - logger.log: "Grid Charging off: normal settings restored"

select:
  # Confirmed 2026-09-30, all four values, by direct app before/after
  # writes. Register 0x0072 LOW byte.
  - platform: template
    name: "Grid Connected Mode"
    id: grid_connected_mode
    options:
      - "Hybrid Mode"
      - "Grid Connected Power Supply Mode"
      - "Off Grid Mode"
      - "Grid Connected Anti Backflow Mode"
    update_interval: 5s
    lambda: |-
      if (isnan(id(grid_connected_mode_num).state)) return {};
      int val = id(grid_connected_mode_num).state;
      if (val == 0) return std::string("Hybrid Mode");
      if (val == 1) return std::string("Grid Connected Power Supply Mode");
      if (val == 2) return std::string("Off Grid Mode");
      if (val == 3) return std::string("Grid Connected Anti Backflow Mode");
      return std::string("Unknown");
    set_action:
      - number.set:
          id: grid_connected_mode_num
          value: !lambda |-
            if (x == "Hybrid Mode") return 0;
            if (x == "Grid Connected Power Supply Mode") return 1;
            if (x == "Off Grid Mode") return 2;
            if (x == "Grid Connected Anti Backflow Mode") return 3;
            return 3;

  - platform: template
    name: "Setting: Charging Priority"
    id: setting_charger_priority
    options:
      - "SNU (PV + Mains)"
      - "OSO (Only Solar)"
      - "CSO (PV Priority)"
    update_interval: 5s
    lambda: |-
      if (isnan(id(setting_charger_priority_num).state)) return {};
      int val = id(setting_charger_priority_num).state;
      if (val == 0) return std::string("SNU (PV + Mains)");
      if (val == 1) return std::string("OSO (Only Solar)");
      if (val == 2) return std::string("CSO (PV Priority)");
      return std::string("SNU (PV + Mains)");
    set_action:
      - number.set:
          id: setting_charger_priority_num
          value: !lambda |-
            if (x == "SNU (PV + Mains)") return 0;
            if (x == "OSO (Only Solar)") return 1;
            if (x == "CSO (PV Priority)") return 2;
            return 0;

  # A17 per the manual. 4 (PAC) is confirmed as this unit's original
  # value; the rest follow the manual/app list order.
  - platform: template
    name: "Setting A17: BMS Protocol"
    id: setting_bms_protocol
    options:
      - "Pb (Lead-acid)"
      - "GRO (Growatt)"
      - "VLO (Voltronic)"
      - "PYL (Pylon)"
      - "PAC (PACE)"
      - "PYL (Pylon, alt)"
    update_interval: 5s
    lambda: |-
      if (isnan(id(setting_bms_protocol_num).state)) return {};
      int val = id(setting_bms_protocol_num).state;
      switch (val) {
        case 0: return std::string("Pb (Lead-acid)");
        case 1: return std::string("GRO (Growatt)");
        case 2: return std::string("VLO (Voltronic)");
        case 3: return std::string("PYL (Pylon)");
        case 4: return std::string("PAC (PACE)");
        case 5: return std::string("PYL (Pylon, alt)");
      }
      return {};
    set_action:
      - number.set:
          id: setting_bms_protocol_num
          value: !lambda |-
            if (x == "Pb (Lead-acid)") return 0;
            if (x == "GRO (Growatt)") return 1;
            if (x == "VLO (Voltronic)") return 2;
            if (x == "PYL (Pylon)") return 3;
            if (x == "PAC (PACE)") return 4;
            return 5;

  # A0 Output Priority, 0x0060 HIGH byte (LOW byte = ID Address).
  # 2 = PV and 3 = PBG confirmed by app writes. 1 = Mains is inferred
  # from the portal's option order (Mains, PV, Battery).
  - platform: template
    name: "Setting A0: Output Priority"
    id: setting_load_priority
    options:
      - "Mains (unconfirmed)"
      - "PV"
      - "PBG (Battery)"
      - "Other (see raw value)"
    update_interval: 5s
    lambda: |-
      if (isnan(id(setting_load_priority_num).state)) return {};
      int val = id(setting_load_priority_num).state;
      if (val == 1) return std::string("Mains (unconfirmed)");
      if (val == 2) return std::string("PV");
      if (val == 3) return std::string("PBG (Battery)");
      return std::string("Other (see raw value)");
    set_action:
      - if:
          condition:
            lambda: 'return x == "Mains (unconfirmed)" || x == "PV" || x == "PBG (Battery)";'
          then:
            - number.set:
                id: setting_load_priority_num
                value: !lambda 'return x == "PV" ? 2 : (x == "PBG (Battery)" ? 3 : 1);'
          else:
            - logger.log:
                format: "Output Priority: value not mapped."
                level: WARN

