  # ====================================================
  # TEMPLATE SENSORS — unchanged this session.
  # ====================================================
  - platform: template
    name: "PV1 Power"
    id: pv1_power
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (id(pv1_voltage).has_state() && id(pv1_current).has_state()) {
        return max(0.0f, id(pv1_voltage).state * id(pv1_current).state);
      }
      return 0.0f;

  - platform: template
    name: "PV2 Power"
    id: pv2_power
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (id(pv2_voltage).has_state() && id(pv2_current).has_state()) {
        return max(0.0f, id(pv2_voltage).state * id(pv2_current).state);
      }
      return 0.0f;

  - platform: template
    name: "Total PV Power"
    id: total_pv_power
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      float p1 = (id(pv1_voltage).has_state() && id(pv1_current).has_state()) ? max(0.0f, id(pv1_voltage).state * id(pv1_current).state) : 0.0f;
      float p2 = (id(pv2_voltage).has_state() && id(pv2_current).has_state()) ? max(0.0f, id(pv2_voltage).state * id(pv2_current).state) : 0.0f;
      return p1 + p2;

  - platform: template
    name: "PV1 Contribution"
    id: pv1_contribution
    unit_of_measurement: "%"
    icon: "mdi:solar-power"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      static float last_val_1 = -1.0f;
      float target_val = 0.0f;
      float max_slew = 0.5f;
      if (id(pv1_power).has_state() && id(pv2_power).has_state()) {
        float p1 = id(pv1_power).state;
        float p2 = id(pv2_power).state;
        float sum = p1 + p2;
        if (sum > 5.0f) {
          target_val = (p1 / sum) * 100.0f;
        }
      }
      if (last_val_1 < 0.0f && target_val > 0.0f) {
         last_val_1 = target_val;
         return target_val;
      } else if (last_val_1 < 0.0f) {
         return 0.0f;
      }
      if (target_val > last_val_1 + max_slew) {
        last_val_1 += max_slew;
      } else if (target_val < last_val_1 - max_slew) {
        last_val_1 -= max_slew;
      } else {
        last_val_1 = target_val;
      }
      return last_val_1;

  - platform: template
    name: "PV2 Contribution"
    id: pv2_contribution
    unit_of_measurement: "%"
    icon: "mdi:solar-power"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      static float last_val_2 = -1.0f;
      float target_val = 0.0f;
      float max_slew = 0.5f;
      if (id(pv1_power).has_state() && id(pv2_power).has_state()) {
        float p1 = id(pv1_power).state;
        float p2 = id(pv2_power).state;
        float sum = p1 + p2;
        if (sum > 5.0f) {
          target_val = (p2 / sum) * 100.0f;
        }
      }
      if (last_val_2 < 0.0f && target_val > 0.0f) {
         last_val_2 = target_val;
         return target_val;
      } else if (last_val_2 < 0.0f) {
         return 0.0f;
      }
      if (target_val > last_val_2 + max_slew) {
        last_val_2 += max_slew;
      } else if (target_val < last_val_2 - max_slew) {
        last_val_2 -= max_slew;
      } else {
        last_val_2 = target_val;
      }
      return last_val_2;

  - platform: template
    name: "Battery Power"
    id: battery_power_net
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (id(batt_v).has_state() && id(batt_net_current).has_state()) {
        return id(batt_v).state * id(batt_net_current).state;
      }
      return {};

  - platform: template
    name: "Inverter Load Percentage"
    id: inverter_load_pct
    unit_of_measurement: "%"
    icon: "mdi:gauge"
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      if (id(ac_output_active_power).has_state()) {
        return (id(ac_output_active_power).state / 6300.0f) * 100.0f;
      }
      return {};

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: datouboss_fast
    name: "Grid Present"
    id: grid_present
    address: 0x0017
    register_type: holding
    bitmask: 0x0004
    device_class: power
  # NOTE: this bit stays False whenever the grid is present and healthy,
  # regardless of Grid Connected Mode — it reflects bypass-vs-invert,
  # not which charging mode is active. Confirmed this session.
  - platform: modbus_controller
    modbus_controller_id: datouboss_fast
    name: "Inverter Output Active"
    id: inverter_output_active
    address: 0x0017
    register_type: holding
    bitmask: 0x0100
    device_class: running
