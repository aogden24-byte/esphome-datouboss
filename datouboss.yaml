# ============================================================
# Datouboss 4863U (SRNE-based) RS485 / Modbus package for ESPHome
#
# Include this from your device config with `packages:`.
# See README.md for wiring, the confirmed register map, and caveats.
#
# Tested on: Datouboss 4863U, 6300 W, 48 V, 120 V/60 Hz single phase,
# via the WiFi-dongle RJ45 port (NOT the BMS port).
#
# SAFETY: every template switch below uses restore_mode: DISABLED so
# nothing is written to the inverter on boot. Keep it that way.
# ============================================================

# Defaults - override any of these in your own device config.
substitutions:
  uart_rx_pin: GPIO22
  uart_tx_pin: GPIO19
  modbus_address: "1"

uart:
  id: mod_uart
  rx_pin: ${uart_rx_pin}
  tx_pin: ${uart_tx_pin}
  baud_rate: 9600
  stop_bits: 1
  data_bits: 8
  parity: NONE
  rx_full_threshold: 1
  rx_timeout: 2

modbus:
  id: modbus0
  uart_id: mod_uart
  turnaround_time: 20ms

modbus_controller:
  - id: datouboss_fast
    address: ${modbus_address}
    modbus_id: modbus0
    setup_priority: -10
    update_interval: 1s

  - id: datouboss_slow
    address: ${modbus_address}
    modbus_id: modbus0
    setup_priority: -10
    update_interval: 20s

# ====================================================
# INVERTER POWER SWITCH — confirmed 2026-09-30 via RS485 sniff.
# Register 0x0087, low byte only: write 0x0100 for OFF, 0x0101 for ON.
# High byte observed constant at 0x01 across every read regardless of
# state, so it's hardcoded here rather than preserved via read-back.
# (The old 0xDF00 attempt is gone — that address was rejected outright
# with Modbus exception 2 and never worked.)
#
# NOTE: this file has exactly ONE "number:" key, covering every
# writable register below (power switch through max charge current).
# Do not add a second "number:" block — YAML/ESPHome will reject a
# duplicate top-level key. Same rule for "switch:" and "select:".
# ====================================================
number:
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: inverter_output_enable_num
    address: 0x0087
    register_type: holding
    value_type: U_WORD
    internal: true
    min_value: 0
    max_value: 1
    step: 1
    lambda: "return (int)(((uint16_t)x) & 0xFF);"
    write_lambda: "return (uint16_t)(0x0100 | ((uint16_t)x & 0xFF));"

  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: intelligent_output_switch_num
    address: 0x007B
    register_type: holding
    value_type: U_WORD
    internal: true
    min_value: 0
    max_value: 1
    step: 1

  # Confirmed 2026-09-30. Register 0x0072 LOW byte, shares the register
  # with Over Temp Restart below — the high byte is preserved on write,
  # not clobbered.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: grid_connected_mode_num
    address: 0x0072
    register_type: holding
    value_type: U_WORD
    internal: true
    min_value: 0
    max_value: 3
    step: 1
    lambda: "return (int)(((uint16_t)x) & 0xFF);"
    write_lambda: |-
      float restart_f = id(setting_over_temp_restart_num).state;
      if (isnan(restart_f)) return NAN;
      uint16_t restart = (uint16_t) restart_f;
      return (uint16_t)((restart << 8) | ((uint16_t)x & 0xFF));

  # Confirmed 2026-09-30. Register 0x0072 HIGH byte — see above.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_over_temp_restart_num
    address: 0x0072
    register_type: holding
    value_type: U_WORD
    internal: true
    min_value: 0
    max_value: 1
    step: 1
    lambda: "return (int)(((uint16_t)x) >> 8);"
    write_lambda: |-
      float grid_mode_f = id(grid_connected_mode_num).state;
      if (isnan(grid_mode_f)) return NAN;
      uint16_t grid_mode = (uint16_t) grid_mode_f;
      return (uint16_t)(((uint16_t)x << 8) | (grid_mode & 0xFF));

  # Confirmed 2026-09-30, corrected address from the original guess of
  # 0x0090 (wrong) to 0x0063 (right). Numeric order confirmed both
  # directions (0=SNU, 1=OSO). 2=CSO inferred, not directly tested.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_charger_priority_num
    address: 0x0063
    register_type: holding
    value_type: U_WORD
    internal: true
    min_value: 0
    max_value: 2
    step: 1
    lambda: "return (int)(((uint16_t)x) >> 8);"
    write_lambda: "return (uint16_t)(((uint16_t)x << 8) | 0x00);"

  # Untouched this session; label meaning ("PACE") confirmed correct by
  # you against the real manual, but the underlying numeric value was
  # never independently re-verified with a fresh write test.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_bms_protocol_num
    address: 0x0088
    register_type: holding
    value_type: U_WORD
    internal: true
    min_value: 0
    max_value: 10
    step: 1
    lambda: "return (int)(((uint16_t)x) >> 8);"
    write_lambda: |-
      float batt_type_f = id(setting_battery_type_num).state;
      if (isnan(batt_type_f)) return NAN;
      uint16_t batt_type = (uint16_t) batt_type_f;
      return (uint16_t)(((uint16_t)x << 8) | (batt_type & 0xFF));

  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_battery_type_num
    address: 0x0088
    register_type: holding
    value_type: U_WORD
    internal: true
    min_value: 0
    max_value: 10
    step: 1
    lambda: "return (int)(((uint16_t)x) & 0xFF);"
    write_lambda: |-
      float proto_f = id(setting_bms_protocol_num).state;
      if (isnan(proto_f)) return NAN;
      uint16_t proto = (uint16_t) proto_f;
      return (uint16_t)(((uint16_t)proto << 8) | ((uint16_t)x & 0xFF));

  # Confirmed correct as-is by direct write test (12A -> 13A).
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_ac_input_limit
    name: "Setting A16: Master AC Input Limit"
    address: 0x0075
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    min_value: 0
    max_value: 60
    step: 1
    lambda: "return (int)(((uint16_t)x) >> 8);"
    write_lambda: "return (uint16_t)(((uint16_t)x << 8) | 0x00);"

  # Confirmed 2026-09-30 by direct write test — corrected from the old
  # "AC Charge Start/Stop SOC" guess, which was the wrong meaning at the
  # right address.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_mains_supply_soc
    name: "Setting: Priority Inverter To Mains Supply SOC"
    address: 0x008A
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    lambda: "return (int)(((uint16_t)x) >> 8);"
    write_lambda: |-
      float batt_soc_f = id(setting_battery_powered_soc).state;
      if (isnan(batt_soc_f)) return NAN;
      uint16_t batt_soc = (uint16_t) batt_soc_f;
      return (uint16_t)(((uint16_t)x << 8) | (batt_soc & 0xFF));

  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_battery_powered_soc
    name: "Setting: Priority Inverter To Battery Powered SOC"
    address: 0x008A
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    lambda: "return (int)(((uint16_t)x) & 0xFF);"
    write_lambda: |-
      float mains_soc_f = id(setting_mains_supply_soc).state;
      if (isnan(mains_soc_f)) return NAN;
      uint16_t mains_soc = (uint16_t) mains_soc_f;
      return (uint16_t)(((uint16_t)mains_soc << 8) | ((uint16_t)x & 0xFF));

  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_float_charge_voltage
    name: "Setting: Float Charge Voltage"
    address: 0x0068
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    min_value: 40.0
    max_value: 60.0
    step: 0.1
    lambda: "return x * 0.1;"
    write_lambda: "return (uint16_t)(x * 10.0);"

  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_bulk_voltage
    name: "Setting: Max Charge and Bulk Voltage (role unclear)"
    address: 0x006B
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    min_value: 40.0
    max_value: 60.0
    step: 0.1
    lambda: "return x * 0.1;"
    write_lambda: "return (uint16_t)(x * 10.0);"

  # Register confirmed correct (write lands, echoes correctly). BUT:
  # tested twice this session with the battery sitting several minutes,
  # comfortably above this threshold, in two different Grid Connected
  # Modes — charging never responded. Address is right; whether this
  # setting actually does anything on this firmware is now in serious
  # doubt.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_charge_disconnect_v
    name: "Setting: Charge Disconnect Voltage"
    address: 0x0067
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    mode: box
    min_value: 45.0
    max_value: 56.8
    step: 0.1
    lambda: "return x * 0.1;"
    write_lambda: "return (uint16_t)(x * 10.0f + 0.5f);"

  # Corrected 2026-09-30: this is "Inverter Priority Battery Supply
  # Voltage" (governs load-source switchover in SBU mode), not "Grid
  # Charge Disable Voltage" as originally guessed. Confirmed both
  # directions by direct write test.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_battery_supply_v
    name: "Setting: Inverter Priority Battery Supply Voltage"
    address: 0x0070
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    min_value: 40.0
    max_value: 60.0
    step: 0.1
    lambda: "return x * 0.1;"
    write_lambda: "return (uint16_t)(x * 10.0);"

  # Corrected 2026-09-30: this is "Inverter Priority Mains Supply
  # Voltage", not "Low Voltage Disconnect". Confirmed by direct write
  # test.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_mains_supply_v
    name: "Setting: Inverter Priority Mains Supply Voltage"
    address: 0x0071
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    min_value: 40.0
    max_value: 55.0
    step: 0.1
    lambda: "return x * 0.1;"
    write_lambda: "return (uint16_t)(x * 10.0);"

  # Untouched this session — still an inherited guess, never tested.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_grid_charge_enable_v
    name: "Setting: Grid Charge Enable Voltage (unconfirmed)"
    address: 0x006E
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    min_value: 40.0
    max_value: 55.0
    step: 0.1
    lambda: "return x * 0.1;"
    write_lambda: "return (uint16_t)(x * 10.0);"

  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_max_charge_current
    name: "Setting: Max Total Charge Current"
    address: 0x0064
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    min_value: 0
    max_value: 100
    step: 5
    lambda: "return (int)(((uint16_t)x) >> 8);"
    write_lambda: "return (uint16_t)(((uint16_t)x << 8) | 0x0A);"

  # Confirmed 2026-09-30: only two of these four values were directly
  # observed by real app before/after writes — 2=PV, 3=Battery. "Grid"
  # was never tested; not writable until confirmed (see select below).
  # Read-only: 0x0060's low byte was never write-tested, so no
  # write_lambda is defined here — writing to this number would send a
  # low byte of 0x00 and could clobber whatever that half actually
  # controls. Change this setting from the app until that's confirmed.
  - platform: modbus_controller
    modbus_controller_id: datouboss_slow
    id: setting_load_priority_num
    address: 0x0060
    register_type: holding
    value_type: U_WORD
    internal: true
    min_value: 2
    max_value: 3
    step: 1
    lambda: "return (int)(((uint16_t)x) >> 8);"

switch:
  - platform: template
    name: "Inverter Power Switch"
    id: inverter_power_switch
    icon: "mdi:power"
    # Reads real state from 0x0087 (low byte 1 = on) instead of guessing.
    optimistic: false
    lambda: |-
      if (!id(inverter_output_enable_num).has_state()) return {};
      return id(inverter_output_enable_num).state > 0.5;
    # CRITICAL: DISABLED means no turn_on/turn_off action fires at boot.
    # Without it, ESPHome defaults to ALWAYS_OFF and would switch the
    # inverter output OFF on every reboot/reflash.
    restore_mode: DISABLED
    turn_on_action:
      - number.set:
          id: inverter_output_enable_num
          value: 1
    turn_off_action:
      - number.set:
          id: inverter_output_enable_num
          value: 0

  # Confirmed 2026-09-30, both directions. Register 0x007B, whole
  # register, 1=On / 0=Off. Possibly the ECO/idle-reduction behavior —
  # never got a clean before/after wattage comparison, worth revisiting.
  - platform: template
    name: "Intelligent Output Switch"
    id: intelligent_output_switch
    icon: "mdi:leaf"
    optimistic: false
    restore_mode: DISABLED
    lambda: |-
      if (!id(intelligent_output_switch_num).has_state()) return {};
      return id(intelligent_output_switch_num).state > 0.5;
    turn_on_action:
      - number.set:
          id: intelligent_output_switch_num
          value: 1
    turn_off_action:
      - number.set:
          id: intelligent_output_switch_num
          value: 0

  # Confirmed 2026-09-30. Register 0x0072 HIGH byte, shares the register
  # with Grid Connected Mode below — the low byte is preserved on write,
  # not clobbered.
  - platform: template
    name: "Setting: Over Temperature Restart"
    id: setting_over_temp_restart
    optimistic: false
    restore_mode: DISABLED
    lambda: |-
      if (!id(setting_over_temp_restart_num).has_state()) return {};
      return id(setting_over_temp_restart_num).state > 0.5;
    turn_on_action:
      - number.set:
          id: setting_over_temp_restart_num
          value: 1
    turn_off_action:
      - number.set:
          id: setting_over_temp_restart_num
          value: 0

# ====================================================
# SETTINGS MENUS
# ====================================================
select:
  # Confirmed 2026-09-30, all four values, by direct app before/after
  # writes. Register 0x0072 LOW byte.
  - platform: template
    name: "Grid Connected Mode"
    id: grid_connected_mode
    options:
      - "Hybrid Mode"
      - "Grid Connected Power Supply Mode"
      - "Off Grid Mode"
      - "Grid Connected Anti Backflow Mode"
    update_interval: 5s
    lambda: |-
      if (isnan(id(grid_connected_mode_num).state)) return {};
      int val = id(grid_connected_mode_num).state;
      if (val == 0) return std::string("Hybrid Mode");
      if (val == 1) return std::string("Grid Connected Power Supply Mode");
      if (val == 2) return std::string("Off Grid Mode");
      if (val == 3) return std::string("Grid Connected Anti Backflow Mode");
      return std::string("Unknown");
    set_action:
      - number.set:
          id: grid_connected_mode_num
          value: !lambda |-
            if (x == "Hybrid Mode") return 0;
            if (x == "Grid Connected Power Supply Mode") return 1;
            if (x == "Off Grid Mode") return 2;
            if (x == "Grid Connected Anti Backflow Mode") return 3;
            return 3;

  - platform: template
    name: "Setting: Charging Priority"
    id: setting_charger_priority
    options:
      - "SNU (PV + Mains)"
      - "OSO (Only Solar)"
      - "CSO (PV Priority)"
    update_interval: 5s
    lambda: |-
      if (isnan(id(setting_charger_priority_num).state)) return {};
      int val = id(setting_charger_priority_num).state;
      if (val == 0) return std::string("SNU (PV + Mains)");
      if (val == 1) return std::string("OSO (Only Solar)");
      if (val == 2) return std::string("CSO (PV Priority)");
      return std::string("SNU (PV + Mains)");
    set_action:
      - number.set:
          id: setting_charger_priority_num
          value: !lambda |-
            if (x == "SNU (PV + Mains)") return 0;
            if (x == "OSO (Only Solar)") return 1;
            if (x == "CSO (PV Priority)") return 2;
            return 0;

  - platform: template
    name: "Setting A17: BMS Protocol"
    id: setting_bms_protocol
    options:
      - "0: User/None"
      - "1: PYLON"
      - "5: PACE"
    update_interval: 5s
    lambda: |-
      if (isnan(id(setting_bms_protocol_num).state)) return {};
      int val = id(setting_bms_protocol_num).state;
      if (val == 0) return std::string("0: User/None");
      if (val == 1) return std::string("1: PYLON");
      if (val == 5) return std::string("5: PACE");
      return std::to_string(val) + ": Other";
    set_action:
      - number.set:
          id: setting_bms_protocol_num
          value: !lambda |-
            if (x == "0: User/None") return 0;
            if (x == "1: PYLON") return 1;
            if (x == "5: PACE") return 5;
            return 5;

  # Read-only display of Load Priority Supply Mode. 2=PV and 3=Battery
  # confirmed; not made settable from this select because the low byte
  # of 0x0060 was never tested (see the number: entry's comment above).
  # Use the app for now if you need to change this.
  - platform: template
    name: "Setting: Load Priority Supply Mode (read-only)"
    id: setting_load_priority
    options:
      - "PV"
      - "Battery"
      - "Unknown"
    update_interval: 5s
    # optimistic can't be combined with lambda (lambda means the state
    # is computed/read, not just assumed). set_action is required by
    # the platform regardless, so this one just logs and does NOT write
    # to 0x0060 — its low byte was never write-tested, so no real write
    # action is wired up on purpose.
    set_action:
      - logger.log:
          format: "Setting: Load Priority Supply Mode is read-only in ESPHome — use the app to change this."
          level: WARN
    lambda: |-
      if (isnan(id(setting_load_priority_num).state)) return {};
      int val = id(setting_load_priority_num).state;
      if (val == 2) return std::string("PV");
      if (val == 3) return std::string("Battery");
      return std::string("Unknown");

