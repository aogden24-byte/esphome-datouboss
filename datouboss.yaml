        }
      }
      if (last_val_2 < 0.0f && target_val > 0.0f) {
         last_val_2 = target_val;
         return target_val;
      } else if (last_val_2 < 0.0f) {
         return 0.0f;
      }
      if (target_val > last_val_2 + max_slew) {
        last_val_2 += max_slew;
      } else if (target_val < last_val_2 - max_slew) {
        last_val_2 -= max_slew;
      } else {
        last_val_2 = target_val;
      }
      return last_val_2;

  - platform: template
    name: "Battery Power"
    id: battery_power_net
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (id(batt_v).has_state() && id(batt_net_current).has_state()) {
        return id(batt_v).state * id(batt_net_current).state;
      }
      return {};

  - platform: template
    name: "Inverter Load Percentage"
    id: inverter_load_pct
    unit_of_measurement: "%"
    icon: "mdi:gauge"
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      if (id(ac_output_active_power).has_state()) {
        return (id(ac_output_active_power).state / 6300.0f) * 100.0f;
      }
      return {};

text_sensor:
  # Neutral-ground bond relay, 0x0075 LOW byte. READ-ONLY on purpose:
  # closing it where the system is already bonded at the main panel
  # creates a second N-G bond.
  - platform: template
    name: "Setting: Neutral Grounding"
    icon: "mdi:alert-octagon-outline"
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      if (isnan(id(reg_0075_raw).state)) return {};
      return (((uint16_t) id(reg_0075_raw).state) & 0xFF)
          ? std::string("Neutral Grounding (BOND CLOSED)") : std::string("Neutral Not Grounding");
  - platform: template
    name: "Setting: Battery Free Mode"
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      if (isnan(id(reg_0063_raw).state)) return {};
      uint8_t v = ((uint16_t) id(reg_0063_raw).state) & 0xFF;
      return v == 0 ? std::string("Battery Connected") : std::string("Raw ") + std::to_string(v);

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: datouboss_fast
    name: "Grid Present"
    id: grid_present
    address: 0x0017
    register_type: holding
    bitmask: 0x0004
    device_class: power
  # NOTE: this bit stays False whenever the grid is present and healthy,
  # regardless of Grid Connected Mode — it reflects bypass-vs-invert,
  # not which charging mode is active. Confirmed this session.
  - platform: modbus_controller
    modbus_controller_id: datouboss_fast
    name: "Inverter Output Active"
    id: inverter_output_active
    address: 0x0017
    register_type: holding
    bitmask: 0x0100
    device_class: running
